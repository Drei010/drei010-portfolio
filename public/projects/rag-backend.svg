<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">RAG Backend architecture</title>
  <desc id="desc">Documents flow through chunking, embeddings, vector search, and a language model response.</desc>
  <rect width="1600" height="1000" fill="#111111"/>
  <circle cx="1320" cy="140" r="220" fill="#f97316" opacity=".08"/>
  <text x="120" y="150" fill="#f97316" font-family="system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="5">PYTHON RAG LEARNING</text>
  <text x="120" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="76" font-weight="700">RAG Backend</text>
  <text x="120" y="285" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="30">Retrieval-Augmented Generation pipeline</text>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(120 450)">
      <rect width="210" height="180" rx="20" fill="#1d1d1d" stroke="#404040" stroke-width="3"/>
      <text x="105" y="75" text-anchor="middle" fill="#f97316" font-size="44">DOCS</text>
      <text x="105" y="125" text-anchor="middle" fill="#ffffff" font-size="24">Documents</text>
    </g>
    <g transform="translate(430 450)">
      <rect width="210" height="180" rx="20" fill="#1d1d1d" stroke="#404040" stroke-width="3"/>
      <text x="105" y="75" text-anchor="middle" fill="#f97316" font-size="40">CHUNK</text>
      <text x="105" y="125" text-anchor="middle" fill="#ffffff" font-size="24">Split + embed</text>
    </g>
    <g transform="translate(740 450)">
      <rect width="210" height="180" rx="20" fill="#1d1d1d" stroke="#f97316" stroke-width="3"/>
      <text x="105" y="75" text-anchor="middle" fill="#f97316" font-size="40">DB</text>
      <text x="105" y="125" text-anchor="middle" fill="#ffffff" font-size="24">Vector store</text>
    </g>
    <g transform="translate(1050 450)">
      <rect width="210" height="180" rx="20" fill="#1d1d1d" stroke="#404040" stroke-width="3"/>
      <text x="105" y="75" text-anchor="middle" fill="#f97316" font-size="40">LLM</text>
      <text x="105" y="125" text-anchor="middle" fill="#ffffff" font-size="24">Grounded answer</text>
    </g>
  </g>
  <g fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 540h70l-22-18m22 18-22 18"/>
    <path d="M660 540h70l-22-18m22 18-22 18"/>
    <path d="M970 540h70l-22-18m22 18-22 18"/>
  </g>
  <text x="120" y="850" fill="#737373" font-family="ui-monospace, monospace" font-size="24">Python · LangChain · ChromaDB · OpenAI</text>
</svg>
